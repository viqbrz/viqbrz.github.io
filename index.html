<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đếm Ngược Sự Kiện</title>

    <!-- Cấu hình PWA & iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Đếm Ngược">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thư viện Âm Lịch Việt Nam -->
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.8/lunar.min.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 lg:p-8 select-none">

    <div class="w-full max-w-sm sm:max-w-md md:max-w-2xl lg:max-w-4xl my-auto flex flex-col items-center">
        
        <!-- Header: Thông Tin Hôm Nay -->
        <div id="header-info" class="w-full bg-slate-900/90 backdrop-blur-md p-3 sm:p-5 rounded-2xl mb-6 text-center shadow-xl border border-slate-800">
            <div class="text-[10px] sm:text-xs text-slate-400 font-semibold uppercase tracking-widest mb-1">Hôm nay</div>
            <div id="solar-date" class="text-base sm:text-xl font-bold text-yellow-400">--/--/----</div>
            <div id="lunar-date" class="text-xs sm:text-base text-slate-300 mt-0.5">Âm lịch: --/--/----</div>
        </div>

        <!-- Khối Đếm Ngược Trung Tâm -->
        <div class="w-full text-center">
            <div class="flex items-center justify-center gap-2 mb-4">
                <h2 id="event-title" class="text-lg sm:text-2xl md:text-3xl font-extrabold text-slate-100 tracking-tight">--</h2>
                <!-- Nút Mở Danh Sách Sự Kiện -->
                <button onclick="toggleModal('list-modal', true)" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-yellow-400 rounded-lg transition-colors border border-slate-700" title="Danh sách sự kiện">
                    📅
                </button>
            </div>
            
            <!-- Grid Thẻ Số Đếm Ngược -->
            <div class="grid grid-cols-4 gap-2 sm:gap-4 md:gap-6 mb-6 sm:mb-8">
                <div class="bg-yellow-500 text-slate-950 p-2.5 sm:p-5 md:p-6 rounded-2xl flex flex-col items-center justify-center shadow-lg shadow-yellow-500/10">
                    <span id="days" class="text-2xl sm:text-5xl md:text-6xl font-black leading-none">00</span>
                    <span class="text-[9px] sm:text-xs md:text-sm font-bold mt-1 sm:mt-2">NGÀY</span>
                </div>
                <div class="bg-slate-900/90 backdrop-blur-md p-2.5 sm:p-5 md:p-6 rounded-2xl flex flex-col items-center justify-center border border-slate-800">
                    <span id="hours" class="text-2xl sm:text-5xl md:text-6xl font-black leading-none">00</span>
                    <span class="text-[9px] sm:text-xs md:text-sm text-slate-400 font-bold mt-1 sm:mt-2">GIỜ</span>
                </div>
                <div class="bg-slate-900/90 backdrop-blur-md p-2.5 sm:p-5 md:p-6 rounded-2xl flex flex-col items-center justify-center border border-slate-800">
                    <span id="minutes" class="text-2xl sm:text-5xl md:text-6xl font-black leading-none">00</span>
                    <span class="text-[9px] sm:text-xs md:text-sm text-slate-400 font-bold mt-1 sm:mt-2">PHÚT</span>
                </div>
                <div class="bg-slate-900/90 backdrop-blur-md p-2.5 sm:p-5 md:p-6 rounded-2xl flex flex-col items-center justify-center border border-slate-800">
                    <span id="seconds" class="text-2xl sm:text-5xl md:text-6xl font-black leading-none">00</span>
                    <span class="text-[9px] sm:text-xs md:text-sm text-slate-400 font-bold mt-1 sm:mt-2">GIÂY</span>
                </div>
            </div>

            <!-- Thanh Tiến Trình -->
            <div class="w-full bg-slate-900 h-2 sm:h-3 rounded-full overflow-hidden border border-slate-800 p-0.5">
                <div id="progress-bar" class="bg-yellow-500 h-full rounded-full transition-all duration-1000 w-0"></div>
            </div>
        </div>

        <!-- Footer: Thông Tin Sự Kiện Đang Chọn -->
        <div class="w-full grid grid-cols-2 gap-3 mt-6 sm:mt-10 text-xs sm:text-sm text-slate-400 bg-slate-900/50 p-3 sm:p-4 rounded-xl border border-slate-800/80">
            <div>Dương lịch: <span id="target-solar" class="text-slate-200 font-semibold">--/--/----</span></div>
            <div class="text-right">Âm lịch: <span id="target-lunar" class="text-slate-200 font-semibold">--/--/----</span></div>
        </div>

    </div>

    <!-- BOX MODAL 1: DANH SÁCH SỰ KIỆN -->
    <div id="list-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 sm:p-6 shadow-2xl flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-white">Danh sách sự kiện</h3>
                <button onclick="toggleModal('list-modal', false)" class="text-slate-400 hover:text-white">✕</button>
            </div>
            
            <div id="events-container" class="space-y-2 overflow-y-auto pr-1 my-2 flex-1">
                <!-- Data Rendered Here -->
            </div>

            <div class="pt-4 border-t border-slate-800 flex justify-between gap-2">
                <button onclick="openAddModal()" class="w-full py-2.5 bg-yellow-500 text-slate-950 font-bold rounded-xl text-xs hover:bg-yellow-400 flex items-center justify-center gap-1">
                    <span>+</span> Thêm sự kiện mới
                </button>
            </div>
        </div>
    </div>

    <!-- BOX MODAL 2: FORM THÊM SỰ KIỆN -->
    <div id="add-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 sm:p-6 shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-4">Tạo sự kiện mới</h3>
            
            <form id="event-form" onsubmit="addNewEvent(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Tên sự kiện</label>
                    <input type="text" id="input-title" required placeholder="Ví dụ: Sinh nhật, Kỷ niệm..." 
                        class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Loại lịch</label>
                    <select id="input-type" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-500">
                        <option value="solar">Dương lịch</option>
                        <option value="lunar">Âm lịch</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Thời gian diễn ra</label>
                    <input type="datetime-local" id="input-date" required 
                        class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-500">
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="toggleModal('add-modal', false)" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg text-xs font-semibold hover:bg-slate-700">Hủy</button>
                    <button type="submit" class="px-4 py-2 bg-yellow-500 text-slate-950 font-bold rounded-lg text-xs hover:bg-yellow-400">Tạo mới</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const GAN_MAP = { '甲': 'Giáp', '乙': 'Ất', '丙': 'Bính', '丁': 'Đinh', '戊': 'Mậu', '己': 'Kỷ', '庚': 'Canh', '辛': 'Tân', '壬': 'Nhâm', '癸': 'Quý' };
        const ZHI_MAP = { '子': 'Tý', '丑': 'Sửu', '寅': 'Dần', '卯': 'Mão', '辰': 'Thìn', '巳': 'Tỵ', '午': 'Ngọ', '未': 'Mùi', '申': 'Thân', '酉': 'Dậu', '戌': 'Tuất', '亥': 'Hợi' };

        function translateGanZhi(cnGanZhi) {
            if (!cnGanZhi || cnGanZhi.length < 2) return cnGanZhi;
            const gan = GAN_MAP[cnGanZhi[0]] || cnGanZhi[0];
            const zhi = ZHI_MAP[cnGanZhi[1]] || cnGanZhi[1];
            return `${gan} ${zhi}`;
        }

        // Dữ liệu sự kiện khởi tạo
        let events = JSON.parse(localStorage.getItem('countdown_events')) || [
            { id: 1, title: "Tết Nguyên Đán Đinh Mùi 2027", targetDate: "2027-02-06T00:00", type: "solar" },
            { id: 2, title: "Quốc Khánh Việt Nam", targetDate: "2026-09-02T00:00", type: "solar" }
        ];
        
        let selectedEventId = Number(localStorage.getItem('selected_event_id')) || events[0].id;
        const startDate = new Date();

        function toggleModal(modalId, show) {
            const modal = document.getElementById(modalId);
            if (show) {
                if (modalId === 'list-modal') renderEventList();
                modal.classList.remove("hidden");
            } else {
                modal.classList.add("hidden");
            }
        }

        function openAddModal() {
            toggleModal('list-modal', false);
            document.getElementById("event-form").reset();
            toggleModal('add-modal', true);
        }

        function renderEventList() {
            const container = document.getElementById("events-container");
            container.innerHTML = "";

            events.forEach(item => {
                const isSelected = item.id === selectedEventId;
                const div = document.createElement("div");
                div.className = `p-3 rounded-xl border flex items-center justify-between cursor-pointer transition-colors ${
                    isSelected ? 'bg-yellow-500/10 border-yellow-500/50' : 'bg-slate-800/50 border-slate-700/50 hover:bg-slate-800'
                }`;
                
                div.innerHTML = `
                    <div onclick="selectEvent(${item.id})" class="flex-1">
                        <div class="text-sm font-bold ${isSelected ? 'text-yellow-400' : 'text-slate-200'}">${item.title}</div>
                        <div class="text-[10px] text-slate-400">${item.type === 'lunar' ? 'Âm lịch' : 'Dương lịch'}: ${item.targetDate.replace('T', ' ')}</div>
                    </div>
                    ${events.length > 1 ? `
                        <button onclick="deleteEvent(event, ${item.id})" class="text-xs text-slate-500 hover:text-red-400 px-2 py-1">Xóa</button>
                    ` : ''}
                `;
                container.appendChild(div);
            });
        }

        function selectEvent(id) {
            selectedEventId = id;
            localStorage.setItem('selected_event_id', id);
            toggleModal('list-modal', false);
            updateTodayInfo();
            updateCountdown();
        }

        function addNewEvent(e) {
            e.preventDefault();
            const newEvent = {
                id: Date.now(),
                title: document.getElementById("input-title").value,
                targetDate: document.getElementById("input-date").value,
                type: document.getElementById("input-type").value
            };

            events.push(newEvent);
            selectedEventId = newEvent.id;
            
            localStorage.setItem('countdown_events', JSON.stringify(events));
            localStorage.setItem('selected_event_id', selectedEventId);

            toggleModal('add-modal', false);
            updateTodayInfo();
            updateCountdown();
        }

        function deleteEvent(e, id) {
            e.stopPropagation();
            events = events.filter(item => item.id !== id);
            if (selectedEventId === id) {
                selectedEventId = events[0].id;
            }
            localStorage.setItem('countdown_events', JSON.stringify(events));
            localStorage.setItem('selected_event_id', selectedEventId);
            renderEventList();
            updateTodayInfo();
            updateCountdown();
        }

        function getActiveEvent() {
            return events.find(item => item.id === selectedEventId) || events[0];
        }

        function getTargetDateObject(eventItem) {
            const dateObj = new Date(eventItem.targetDate);
            if (eventItem.type === "lunar" && typeof Lunar !== 'undefined') {
                const year = dateObj.getFullYear();
                const month = dateObj.getMonth() + 1;
                const day = dateObj.getDate();
                const lunar = Lunar.fromYmd(year, month, day);
                const solar = lunar.getSolar();
                return new Date(solar.getYear(), solar.getMonth() - 1, solar.getDay(), dateObj.getHours(), dateObj.getMinutes());
            }
            return dateObj;
        }

        function updateTodayInfo() {
            const now = new Date();
            const d = String(now.getDate()).padStart(2, '0');
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const y = now.getFullYear();
            
            document.getElementById("solar-date").innerText = `Dương lịch: ${d}/${m}/${y}`;
            
            const activeEvent = getActiveEvent();
            document.getElementById("event-title").innerText = activeEvent.title;

            if (typeof Lunar !== 'undefined') {
                // Xử lý Ngày Âm lịch Hôm nay 
                const lunar = Lunar.fromDate(now);
                const lunarDay = String(lunar.getDay()).padStart(2, '0');
                const lunarMonth = String(lunar.getMonth()).padStart(2, '0');
                const lunarYearNum = lunar.getYear();
                const lunarYearGanZhi = translateGanZhi(lunar.getYearInGanZhi());

                document.getElementById("lunar-date").innerText = 
                    `Âm lịch: ${lunarDay}/${lunarMonth}/${lunarYearNum} - ${lunarYearGanZhi}`;
                
                // Xử lý Ngày Âm lịch Sự kiện
                const target = getTargetDateObject(activeEvent);
                const targetLunar = Lunar.fromDate(target);
                const tLunarDay = String(targetLunar.getDay()).padStart(2, '0');
                const tLunarMonth = String(targetLunar.getMonth()).padStart(2, '0');
                const tLunarYearNum = targetLunar.getYear();
                const tLunarYearGanZhi = translateGanZhi(targetLunar.getYearInGanZhi());

                document.getElementById("target-solar").innerText = `${target.getDate()}/${target.getMonth()+1}/${target.getFullYear()}`;
                document.getElementById("target-lunar").innerText = `${tLunarDay}/${tLunarMonth}/${tLunarYearNum} - ${tLunarYearGanZhi}`;
            }
        }

        function updateCountdown() {
            const now = new Date();
            const activeEvent = getActiveEvent();
            const target = getTargetDateObject(activeEvent);
            const diff = target.getTime() - now.getTime();

            if (diff <= 0) {
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                document.getElementById("progress-bar").style.width = "100%";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');

            const total = target.getTime() - startDate.getTime();
            const elapsed = now.getTime() - startDate.getTime();
            const pct = Math.min(Math.max((elapsed / total) * 100, 0), 100);
            document.getElementById("progress-bar").style.width = `${pct}%`;
        }

        updateTodayInfo();
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
